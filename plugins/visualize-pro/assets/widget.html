<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <style>
      :root {
        color-scheme: light dark;
        --background: transparent;
        --foreground: CanvasText;
        --card: Canvas;
        --card-foreground: CanvasText;
        --muted: color-mix(in srgb, CanvasText 7%, Canvas);
        --muted-foreground: color-mix(in srgb, CanvasText 58%, Canvas);
        --border: color-mix(in srgb, CanvasText 16%, Canvas);
        --primary: #2563eb;
        --primary-foreground: #fff;
        --destructive: #dc2626;
        --viz-series-1: #2563eb;
        --viz-series-2: #16a34a;
        --viz-series-3: #d97706;
        --viz-series-4: #9333ea;
        --viz-series-5: #0891b2;
        --viz-series-6: #e11d48;
      }

      html,
      body {
        margin: 0;
        min-width: 0;
        background: transparent;
        color: var(--foreground);
      }

      body {
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      html[data-auto-height="true"],
      html[data-auto-height="true"] body {
        overflow: hidden;
      }

      #visualize-pro-widget {
        width: 100%;
        min-width: 0;
      }

      #visualize-pro-status {
        box-sizing: border-box;
        display: none;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--muted);
        color: var(--muted-foreground);
        font-size: 13px;
        line-height: 1.45;
      }

      #visualize-pro-status[data-visible="true"] {
        display: block;
      }

      #visualize-pro-status[data-error="true"] {
        border-color: color-mix(in srgb, var(--destructive) 36%, transparent);
        color: var(--destructive);
      }
    </style>
  </head>
  <body>
    <div id="visualize-pro-widget" aria-live="polite"></div>
    <div id="visualize-pro-status" role="status"></div>

    <script>
      (() => {
        const mount = document.getElementById('visualize-pro-widget')
        const status = document.getElementById('visualize-pro-status')
        let renderedHtml = null
        let resizeFrame = 0
        let lastIntrinsicHeight = 0

        const supportsIntrinsicHeight = () =>
          typeof window.openai?.notifyIntrinsicHeight === 'function'

        const syncAutoHeightCapability = () => {
          document.documentElement.dataset.autoHeight = String(supportsIntrinsicHeight())
        }

        const measureIntrinsicHeight = () =>
          Math.ceil(
            Math.max(
              mount.offsetTop + mount.offsetHeight,
              status.offsetTop + status.offsetHeight,
            ),
          )

        const reportIntrinsicHeight = () => {
          resizeFrame = 0
          syncAutoHeightCapability()
          if (!supportsIntrinsicHeight()) return

          const nextHeight = measureIntrinsicHeight()
          if (nextHeight <= 0 || nextHeight === lastIntrinsicHeight) return
          lastIntrinsicHeight = nextHeight

          try {
            const result = window.openai.notifyIntrinsicHeight(nextHeight)
            result?.catch?.(() => {})
          } catch {
            document.documentElement.dataset.autoHeight = 'false'
          }
        }

        const scheduleIntrinsicHeight = () => {
          if (resizeFrame) cancelAnimationFrame(resizeFrame)
          resizeFrame = requestAnimationFrame(reportIntrinsicHeight)
        }

        const showStatus = (message, error = false) => {
          status.textContent = message
          status.dataset.visible = String(Boolean(message))
          status.dataset.error = String(error)
          scheduleIntrinsicHeight()
        }

        const applyTheme = (theme) => {
          const next =
            theme === 'dark' || theme === 'light'
              ? theme
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = next
          document.documentElement.style.colorScheme = next
          scheduleIntrinsicHeight()
        }

        const executeScripts = () => {
          const scripts = [...mount.querySelectorAll('script')]
          for (const inert of scripts) {
            if (inert.src) {
              throw new Error('External script sources are not supported.')
            }
            const live = document.createElement('script')
            for (const attribute of inert.attributes) {
              live.setAttribute(attribute.name, attribute.value)
            }
            live.textContent = inert.textContent
            inert.replaceWith(live)
          }
        }

        const render = (payload) => {
          if (!payload || payload.ok === false) {
            if (payload?.error) showStatus(payload.error, true)
            return
          }
          if (typeof payload.html !== 'string' || !payload.html.trim()) return
          if (payload.html === renderedHtml) return

          renderedHtml = payload.html
          showStatus('')
          mount.replaceChildren()

          try {
            const template = document.createElement('template')
            template.innerHTML = payload.html
            mount.append(template.content.cloneNode(true))
            executeScripts()
            scheduleIntrinsicHeight()
          } catch (error) {
            mount.replaceChildren()
            showStatus(
              error instanceof Error ? `Widget render failed: ${error.message}` : 'Widget render failed.',
              true,
            )
          }
        }

        const readGlobals = (value) => {
          const globals = value?.globals ?? value ?? {}
          applyTheme(globals.theme ?? window.openai?.theme)
          render(globals.toolOutput ?? window.openai?.toolOutput)
        }

        const resizeObserver =
          typeof ResizeObserver === 'function'
            ? new ResizeObserver(scheduleIntrinsicHeight)
            : null
        resizeObserver?.observe(mount)
        resizeObserver?.observe(status)

        window.addEventListener('openai:set_globals', (event) => readGlobals(event.detail))
        window.addEventListener('load', scheduleIntrinsicHeight)
        window.addEventListener('resize', scheduleIntrinsicHeight)
        window.addEventListener('error', (event) => {
          showStatus(`Widget script error: ${event.message || 'Unknown error'}`, true)
        })
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason instanceof Error ? event.reason.message : String(event.reason)
          showStatus(`Widget promise error: ${reason}`, true)
        })

        syncAutoHeightCapability()
        readGlobals(window.openai)
        document.fonts?.ready?.then(scheduleIntrinsicHeight).catch(() => {})
      })()
    </script>
  </body>
</html>
